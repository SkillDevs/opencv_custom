name: Build XCFramework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available SDKs
        run: xcodebuild -showsdks

      - name: Build xcframework
        run: ./scripts/build_opencv_xcframework.sh
