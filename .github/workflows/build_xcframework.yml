name: Build XCFramework

on:
    workflow_dispatch:

env:
    OPENCV_VERSION: 4.13.0

jobs:
    prepare:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                sparse-checkout: |
                    scripts/ci/_prepare_build.sh
                sparse-checkout-cone-mode: false

            - name: Prepare build
              run: ./scripts/ci/_prepare_build.sh

            - name: Upload contrib
              uses: actions/upload-artifact@v4
              with:
                  name: opencv_contrib
                  path: opencv_contrib-${{ env.OPENCV_VERSION }}

    build:
        needs: prepare

        runs-on: macos-latest

        strategy:
            fail-fast: true
            matrix:
                platform: [ios, simulator, macos]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Show Xcode version
              run: xcodebuild -version

            - name: List available SDKs
              run: xcodebuild -showsdks

            - name: Download contrib
              uses: actions/download-artifact@v4
              with:
                  name: opencv_contrib

            - name: Setup contrib dir
              run: echo "CONTRIB_DIR=opencv_contrib" >> $GITHUB_ENV

            - name: Build framework
              run: |
                  export FRAMEWORK_OUT="build/${{ matrix.platform }}"
                  mkdir -p $FRAMEWORK_OUT

                  if [ "${{ matrix.platform }}" = "ios" ]; then
                    ./scripts/ci/build_ios_framework.sh
                  elif [ "${{ matrix.platform }}" = "simulator" ]; then
                    ./scripts/ci/build_ios_simulator_framework.sh
                  elif [ "${{ matrix.platform }}" = "macos" ]; then
                    ./scripts/ci/build_macos_framework.sh
                  else
                    echo "Unsupported platform: ${{ matrix.platform }}"
                    exit 1
                  fi

            - name: Upload framework
              uses: actions/upload-artifact@v4
              with:
                  name: framework-${{ matrix.platform }}
                  path: build/${{ matrix.platform }}

    aggregate:
        runs-on: macos-latest
        needs: build

        steps:
            - uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: build

            - name: Create XCFramework
              run: |
                  ls -R build
                  xcodebuild -create-xcframework \
                    -framework build/framework-ios/opencv2.framework \
                    -framework build/framework-simulator/opencv2.framework \
                    -framework build/framework-macos/opencv2.framework \
                    -output opencv2.xcframework

            - name: Zip xcframework
              run: |
                  zip -r opencv2_xcframework.zip opencv2.xcframework

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: opencv-${{ env.OPENCV_VERSION }}
                  name: OpenCV XCFramework
                  files: opencv2_xcframework.zip
